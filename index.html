<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baliq Ovi</title>
<script src="https://telegram.org"></script>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body { margin: 0; padding: 0; overflow: hidden; background: linear-gradient(180deg, #0077be 0%, #003366 100%); font-family: sans-serif; color: white; text-align: center; }
  #header { position: fixed; top: 15px; left: 0; width: 100%; display: flex; justify-content: space-around; font-size: 20px; font-weight: bold; z-index: 10; background: rgba(0,0,0,0.3); padding: 10px; }
  #sea { position: relative; width: 100vw; height: 100vh; }
  .fish { position: absolute; font-size: 42px; cursor: pointer; transition: transform 0.1s; }
  .fish:active { transform: scale(1.3); }
  #shop { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: #ff9800; color: #000; border: none; padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer; z-index: 10; }
</style>
</head>
<body>
  <div id="header">
    <div>💰 Tanga: <span id="coins">0</span></div>
    <div>🎣 Qarmoq: <span id="rod">1</span>-daraja</div>
  </div>
  <div id="sea"></div>
  <button id="shop" onclick="upgradeRod()">⬆️ Qarmoqni kuchaytirish (<span id="cost">50</span> 💰)</button>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();
  let coins = parseInt(localStorage.getItem('coins')) || 0;
  let rod = parseInt(localStorage.getItem('rod')) || 1;
  let cost = rod * 50;
  const fishes = ['🐟', '🐠', '🐡', '🦈', '🐙', '🦞'];
  const sea = document.getElementById('sea');

  function updateUI() {
    document.getElementById('coins').innerText = coins;
    document.getElementById('rod').innerText = rod;
    document.getElementById('cost').innerText = cost;
    localStorage.setItem('coins', coins);
    localStorage.setItem('rod', rod);
  }

  function spawnFish() {
    const fish = document.createElement('div');
    fish.className = 'fish';
    const isRare = Math.random() < 0.2;
    fish.innerText = isRare ? '🦈' : fishes[Math.floor(Math.random() * 3)];
    fish.style.top = (70 + Math.random() * (window.innerHeight - 180)) + 'px';
    const fromLeft = Math.random() < 0.5;
    fish.style.left = fromLeft ? '-60px' : (window.innerWidth + 10) + 'px';
    if (!fromLeft) fish.style.transform = 'scaleX(-1)';
    sea.appendChild(fish);

    let pos = fromLeft ? -60 : window.innerWidth + 10;
    const speed = (2 + Math.random() * 3) * (fromLeft ? 1 : -1);
    const move = setInterval(() => {
      pos += speed;
      fish.style.left = pos + 'px';
      if (pos > window.innerWidth + 80 || pos < -80) {
        clearInterval(move);
        fish.remove();
      }
    }, 20);

    fish.onclick = () => {
      coins += (isRare ? 5 : 1) * rod;
      updateUI();
      clearInterval(move);
      fish.innerText = '💥';
      setTimeout(() => fish.remove(), 150);
    };
  }

  function upgradeRod() {
    if (coins >= cost) {
      coins -= cost;
      rod++;
      cost = rod * 50;
      updateUI();
    } else {
      alert("Tanga yetarli emas! Ko'proq baliq tuting.");
    }
  }

  updateUI();
  setInterval(spawnFish, 900);
</script>
</body>
</html>
