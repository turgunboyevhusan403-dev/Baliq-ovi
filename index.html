</head>
<body>
  <div id="header">
    <div>💰 Tanga: <span id="coins">0</span></div>
    <div>🎣 Qarmoq: <span id="rod">1</span>-daraja</div>
  </div>
  <div id="sea"></div>
  <button id="shop" onclick="upgradeRod()">⬆️ Qarmoqni kuchaytirish (<span id="cost">50</span> 💰)</button>

<script>
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.expand();
    }
  } catch (e) {}

  let coins = parseInt(localStorage.getItem('coins')) || 0;
  let rod = parseInt(localStorage.getItem('rod')) || 1;
  let cost = rod * 50;
  const fishes = ['🐟', '🐠', '🐡', '🦈', '🐙', '🦞'];
  const sea = document.getElementById('sea');

  function updateUI() {
    document.getElementById('coins').innerText = coins;
    document.getElementById('rod').innerText = rod;
    document.getElementById('cost').innerText = cost;
    localStorage.setItem('coins', coins);
    localStorage.setItem('rod', rod);
  }

  function spawnFish() {
    const fish = document.createElement('div');
    fish.className = 'fish';
    const isRare = Math.random() < 0.25;
    fish.innerText = isRare ? '🦈' : fishes[Math.floor(Math.random() * fishes.length)];
    fish.style.top = (80 + Math.random() * (window.innerHeight - 200)) + 'px';
    const fromLeft = Math.random() < 0.5;
    fish.style.left = fromLeft ? '-60px' : (window.innerWidth + 10) + 'px';
    if (fromLeft) fish.style.transform = 'scaleX(-1)';
    sea.appendChild(fish);

    let pos = fromLeft ? -60 : window.innerWidth + 10;
    const speed = (2.5 + Math.random() * 3) * (fromLeft ? 1 : -1);
    const move = setInterval(() => {
      pos += speed;
      fish.style.left = pos + 'px';
      if (pos > window.innerWidth + 80 || pos < -80) {
        clearInterval(move);
        fish.remove();
      }
    }, 20);

    fish.onclick = () => {
      coins += (isRare ? 5 : 1) * rod;
      updateUI();
      clearInterval(move);
      fish.innerText = '💥';
      setTimeout(() => fish.remove(), 150);
    };
  }

  function upgradeRod() {
    if (coins >= cost) {
      coins -= cost;
      rod++;
      cost = rod * 50;
      updateUI();
    } else {
      alert("Tanga yetarli emas! Ko'proq baliq tuting.");
    }
  }

  updateUI();
  spawnFish();
  spawnFish();
  setInterval(spawnFish, 800);
</script>
</body>
</html>
