
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Baliq Ovi</title>
  <script src="https://telegram.org"></script>
  <script src="https://adsgram.ai"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; overflow: hidden; background: linear-gradient(180deg, #0077be 0%, #003366 100%); font-family: sans-serif; color: white; }
    #header { position: fixed; top: 15px; left: 0; width: 100%; display: flex; justify-content: space-around; font-size: 18px; font-weight: bold; z-index: 10; background: rgba(0,0,0,0.3); padding: 10px 0; }
    #sea { position: relative; width: 100vw; height: 100vh; }
    .fish { position: absolute; font-size: 46px; cursor: pointer; transition: transform 0.1s; }
    .fish:active { transform: scale(1.3); }
    #shop { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
    button { width: 100%; padding: 13px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #upgradeBtn { background: #ffcc00; color: #000; }
    #adBtn { background: #00e676; color: #000; }
  </style>
</head>
<body>
  <div id="header">
    <div>💰 Tanga: <span id="coins">0</span></div>
    <div>🎣 Qarmoq: <span id="rod">1</span>-daraja</div>
  </div>
  <div id="sea"></div>
  <div id="shop">
    <button id="adBtn">🎬 Reklama ko'rish (+100 tanga)</button>
    <button id="upgradeBtn">⬆️ Qarmoqni kuchaytirish (50 tanga)</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let coins = parseInt(localStorage.getItem('coins')) || 0;
    let rodLevel = parseInt(localStorage.getItem('rodLevel')) || 1;
    let upgradeCost = rodLevel * 50;

    const coinsEl = document.getElementById('coins');
    const rodEl = document.getElementById('rod');
    const upgradeBtn = document.getElementById('upgradeBtn');
    const adBtn = document.getElementById('adBtn');
    const sea = document.getElementById('sea');

    function updateUI() {
      coinsEl.textContent = coins;
      rodEl.textContent = rodLevel;
      upgradeBtn.textContent = `⬆️ Qarmoqni kuchaytirish (${upgradeCost} tanga)`;
      localStorage.setItem('coins', coins);
      localStorage.setItem('rodLevel', rodLevel);
    }

    const fishes = ['🐟', '🐠', '🐡', '🦈', '🐙', '🦀'];
    function spawnFish() {
      const fish = document.createElement('div');
      fish.className = 'fish';
      fish.textContent = fishes[Math.floor(Math.random() * fishes.length)];
      fish.style.left = Math.random() * (window.innerWidth - 60) + 'px';
      fish.style.top = (80 + Math.random() * (window.innerHeight - 230)) + 'px';
      fish.onclick = () => {
        coins += rodLevel * 5;
        updateUI();
        fish.remove();
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      };
      sea.appendChild(fish);
      setTimeout(() => { if (fish.parentNode) fish.remove(); }, 3000);
    }

    setInterval(spawnFish, 900);

    upgradeBtn.onclick = () => {
      if (coins >= upgradeCost) {
        coins -= upgradeCost;
        rodLevel++;
        upgradeCost = rodLevel * 50;
        updateUI();
      } else {
        alert("Tanga yetarli emas!");
      }
    };

    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "59396" }) : null;
    adBtn.onclick = () => {
      if (!AdController) {
        alert("Reklama yuklanmadi, qayta urinib ko'ring.");
        return;
      }
      AdController.show().then(() => {
        coins += 100;
        updateUI();
        alert("Tabriklaymiz! +100 tanga qo'shildi.");
      }).catch(() => {
        alert("Reklama oxirigacha ko'rilmadi yoki hozircha mavjud emas.");
      });
    };

    updateUI();
  </script>
</body>
</html>
